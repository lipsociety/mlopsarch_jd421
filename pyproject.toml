[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lipsociety-mlopsarch_jd421"
version = "0.1.0"
description = "在同一个输入里两两比对，检测MLOps 平台架构师·推理链路的追踪埋点相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lipsociety" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lipsociety.github.io"
Repository = "https://github.com/lipsociety/mlopsarch_jd421"
Issues = "https://github.com/lipsociety/mlopsarch_jd421/issues"

[project.scripts]
mlopsarch_jd421 = "mlopsarch_jd421:main"

[tool.setuptools]
py-modules = ["mlopsarch_jd421"]
